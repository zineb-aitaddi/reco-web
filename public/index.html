<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reconnaissance Faciale - Upload Photo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 28px;
      padding: 42px;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    }

    .logo {
      width: 86px;
      height: 86px;
      margin: 0 auto 24px;
      border-radius: 24px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      color: #111827;
    }

    .subtitle {
      margin: 14px auto 28px;
      max-width: 390px;
      color: #6b7280;
      font-size: 16px;
      line-height: 1.6;
    }

    .upload-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border: 2px dashed #93c5fd;
      background: #f8fafc;
      border-radius: 22px;
      padding: 30px 20px;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .upload-area:hover {
      border-color: #2563eb;
      background: #eff6ff;
      transform: translateY(-2px);
    }

    .upload-area strong {
      color: #1d4ed8;
      font-size: 18px;
    }

    .upload-area span {
      color: #9ca3af;
      font-size: 13px;
    }

    input[type="file"] {
      display: none;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 20px;
      margin-top: 22px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.18);
    }

    .primary-btn {
      display: none;
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.35);
    }

    .primary-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .status {
      margin-top: 22px;
      padding: 15px;
      border-radius: 16px;
      font-size: 15px;
      display: none;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }

    .footer {
      margin-top: 24px;
      color: #9ca3af;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
        <path d="M4 7h3l1.5-2h7L17 7h3v12H4V7Z" stroke="white" stroke-width="2"/>
        <circle cx="12" cy="13" r="4" stroke="white" stroke-width="2"/>
      </svg>
    </div>

    <h1>Reconnaissance Faciale</h1>

    <p class="subtitle">
      Sélectionne ou prends une photo. Elle sera envoyée vers Firebase pour ton système de reconnaissance faciale.
    </p>

    <label for="fileInput" class="upload-area">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none">
        <path d="M12 16V4" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
        <path d="M7 9l5-5 5 5" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
        <path d="M4 16v3h16v-3" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <strong>Choisir ou prendre une photo</strong>
      <span>Formats acceptés : PNG, JPG, JPEG</span>
    </label>

    <input type="file" id="fileInput" accept="image/*" capture="environment">

    <img id="preview" alt="Aperçu de la photo">

    <button id="uploadBtn" class="primary-btn">
      Envoyer vers Firebase
    </button>

    <div id="status" class="status"></div>

    <p class="footer">
      Firebase Storage · Firestore · Auth anonyme
    </p>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBgJyoOpdqSqzEPgosadyt9z-pw6aeuuuw",
      authDomain: "project-9a95e.firebaseapp.com",
      projectId: "project-9a95e",
      storageBucket: "project-9a95e.firebasestorage.app",
      messagingSenderId: "1007569506909",
      appId: "1:1007569506909:web:2d0899e77085a7343f73b4",
      measurementId: "G-EEBFN66NKW"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");

    let selectedFile = null;

    function showStatus(message, type) {
      status.textContent = message;
      status.className = "status " + type;
    }

    signInAnonymously(auth)
      .then(() => {
        showStatus("Authentification réussie. Prêt à uploader.", "success");
      })
      .catch((error) => {
        showStatus("Erreur d'authentification : " + error.message, "error");
      });

    fileInput.addEventListener("change", (e) => {
      selectedFile = e.target.files[0];

      if (!selectedFile) return;

      if (!selectedFile.type.startsWith("image/")) {
        showStatus("Veuillez sélectionner une image valide.", "error");
        return;
      }

      preview.src = URL.createObjectURL(selectedFile);
      preview.style.display = "block";
      uploadBtn.style.display = "block";

      showStatus("Photo sélectionnée. Clique sur Envoyer.", "loading");
    });

    uploadBtn.addEventListener("click", async () => {
      if (!selectedFile) {
        showStatus("Aucune photo sélectionnée.", "error");
        return;
      }

      try {
        uploadBtn.disabled = true;
        uploadBtn.textContent = "Envoi en cours...";

        showStatus("Upload vers Firebase en cours...", "loading");

        const cleanFileName = selectedFile.name.replace(/\s+/g, "_");
        const filePath = "raw_images/" + Date.now() + "_" + cleanFileName;

        const storageRef = ref(storage, filePath);

        await uploadBytes(storageRef, selectedFile);

        const downloadURL = await getDownloadURL(storageRef);

        await addDoc(collection(db, "images"), {
          url: downloadURL,
          fileName: selectedFile.name,
          filePath: filePath,
          uploadedAt: new Date(),
          status: "uploaded"
        });

        showStatus("Photo envoyée et enregistrée avec succès.", "success");

        uploadBtn.textContent = "Photo envoyée";
      } catch (error) {
        showStatus("Erreur lors de l'upload : " + error.message, "error");

        uploadBtn.disabled = false;
        uploadBtn.textContent = "Réessayer";
      }
    });
  </script>

</body>
</html>
